[program:dev_flow_agent]
directory=/opt/app/dev_flow_agent/current
command=/opt/app/dev_flow_agent/shared/start.sh
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
priority=40
stdout_logfile=/opt/app/dev_flow_data/dev-flow-agent.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/opt/app/dev_flow_data/dev-flow-agent.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
environment=HOME="/root",USER="root"
